<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="760" viewBox="0 0 1300 760">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 z" fill="#666666"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="100%" height="100%" fill="#ffffff"/>
  <rect x="40" y="40" width="1220" height="670" rx="12" ry="12" fill="#fafafa" stroke="#b5b5b5" stroke-width="1.6"/>
  <text x="80" y="82" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="28" font-weight="700" fill="#333333">方案三：LoongArch64 LSX 浮点 SIMD lowering 过程</text>

  <rect x="90" y="145" width="210" height="110" rx="10" ry="10" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.6"/>
  <text x="195" y="182" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="24" font-weight="700" text-anchor="middle" fill="#333333">
    <tspan x="195" dy="0">规则浮点循环</tspan>
  </text>
  <text x="195" y="214" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="18" text-anchor="middle" fill="#555555">
    <tspan x="195" dy="0">以 `lu.small` 为代表</tspan>
  </text>

  <rect x="360" y="145" width="230" height="110" rx="10" ry="10" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.6"/>
  <text x="475" y="180" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="24" font-weight="700" text-anchor="middle" fill="#333333">
    <tspan x="475" dy="0">向量化机会识别</tspan>
  </text>
  <text x="475" y="212" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="18" text-anchor="middle" fill="#555555">
    <tspan x="475" dy="0">循环形态规整、数据流可并行</tspan>
  </text>

  <rect x="650" y="145" width="250" height="110" rx="10" ry="10" fill="#d8f0d2" stroke="#82b366" stroke-width="1.6"/>
  <text x="775" y="176" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="24" font-weight="700" text-anchor="middle" fill="#333333">
    <tspan x="775" dy="0">受限开启 LoongArch64</tspan>
    <tspan x="775" dy="30">浮点向量化入口</tspan>
  </text>
  <text x="775" y="226" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="17" text-anchor="middle" fill="#555555">
    <tspan x="775" dy="0">loop_optimization.cc</tspan>
  </text>

  <rect x="965" y="145" width="230" height="110" rx="10" ry="10" fill="#d8f0d2" stroke="#82b366" stroke-width="1.6"/>
  <text x="1080" y="174" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="24" font-weight="700" text-anchor="middle" fill="#333333">
    <tspan x="1080" dy="0">LSX lowering</tspan>
    <tspan x="1080" dy="30">最小可用路径</tspan>
  </text>
  <text x="1080" y="220" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="17" text-anchor="middle" fill="#555555">
    <tspan x="1080" dy="0">broadcast / load-store /</tspan>
    <tspan x="1080" dy="22">add-sub-mul</tspan>
  </text>

  <rect x="515" y="400" width="270" height="120" rx="10" ry="10" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.6"/>
  <text x="650" y="436" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="24" font-weight="700" text-anchor="middle" fill="#333333">
    <tspan x="650" dy="0">生成向量机器码</tspan>
  </text>
  <text x="650" y="468" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="18" text-anchor="middle" fill="#555555">
    <tspan x="650" dy="0">code_generator_loongarch64.h/.cc</tspan>
    <tspan x="650" dy="24">在 `lu.small` 上兑现稳定收益</tspan>
  </text>

  <polyline points="300,200 360,200" fill="none" stroke="#666666" stroke-width="2.0" marker-end="url(#arrow)"/>
  <polyline points="590,200 650,200" fill="none" stroke="#666666" stroke-width="2.0" marker-end="url(#arrow)"/>
  <polyline points="900,200 965,200" fill="none" stroke="#666666" stroke-width="2.0" marker-end="url(#arrow)"/>
  <polyline points="1080,255 1080,320 650,320 650,400" fill="none" stroke="#666666" stroke-width="2.0" marker-end="url(#arrow)"/>

  <rect x="145" y="585" width="1010" height="78" rx="10" ry="10" fill="#fff2cc" stroke="#d6b656" stroke-width="1.6"/>
  <text x="650" y="618" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="22" font-weight="700" text-anchor="middle" fill="#7a5a00">
    <tspan x="650" dy="0">边界说明</tspan>
  </text>
  <text x="650" y="646" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="18" text-anchor="middle" fill="#6a5a00">
    <tspan x="650" dy="0">当前仅覆盖最小可用浮点 SIMD 路径，用于验证规则数值循环能否从 LSX lowering 中直接获益；</tspan>
    <tspan x="650" dy="24">这并不代表完整 SIMD 后端已经覆盖所有向量模式、数据类型与循环形态。</tspan>
  </text>
</svg>
