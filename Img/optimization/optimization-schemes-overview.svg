<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1040" viewBox="0 0 1400 1040">
  <rect x="0" y="0" width="100%" height="100%" fill="#ffffff"/>
  <rect x="40" y="40" width="1320" height="960" rx="12" ry="12" fill="#fafafa" stroke="#b5b5b5" stroke-width="1.6"/>

  <text x="80" y="82" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="28" font-weight="700" fill="#333333">三项正式方案机制总览</text>

  <rect x="80" y="120" width="210" height="96" rx="10" ry="10" fill="#e9e9e9" stroke="#9a9a9a" stroke-width="1.6"/>
  <rect x="320" y="120" width="320" height="96" rx="10" ry="10" fill="#fde2cf" stroke="#d79b00" stroke-width="1.6"/>
  <rect x="680" y="120" width="320" height="96" rx="10" ry="10" fill="#dce9f9" stroke="#6c8ebf" stroke-width="1.6"/>
  <rect x="1040" y="120" width="280" height="96" rx="10" ry="10" fill="#d8f0d2" stroke="#82b366" stroke-width="1.6"/>

  <text x="185" y="177" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="26" font-weight="700" text-anchor="middle" fill="#333333">比较维度</text>
  <text x="480" y="158" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="25" font-weight="700" text-anchor="middle" fill="#333333">方案一</text>
  <text x="480" y="188" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="18" text-anchor="middle" fill="#555555">JIT 分层热度阈值调整</text>
  <text x="840" y="158" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="25" font-weight="700" text-anchor="middle" fill="#333333">方案二</text>
  <text x="840" y="188" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="18" text-anchor="middle" fill="#555555">运行时字符串搬运批量化</text>
  <text x="1180" y="158" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="25" font-weight="700" text-anchor="middle" fill="#333333">方案三</text>
  <text x="1180" y="188" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="18" text-anchor="middle" fill="#555555">LoongArch64 LSX 浮点 SIMD</text>

  <rect x="80" y="236" width="210" height="138" rx="8" ry="8" fill="#f3f3f3" stroke="#b5b5b5" stroke-width="1.4"/>
  <rect x="320" y="236" width="320" height="138" rx="8" ry="8" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.4"/>
  <rect x="680" y="236" width="320" height="138" rx="8" ry="8" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.4"/>
  <rect x="1040" y="236" width="280" height="138" rx="8" ry="8" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.4"/>
  <text x="185" y="313" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="24" font-weight="700" text-anchor="middle" fill="#333333">热点现象</text>
  <text x="480" y="272" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="18" text-anchor="middle" fill="#333333">
    <tspan x="480" dy="0">`pmd` 中部分热点方法在</tspan>
    <tspan x="480" dy="24">运行结束前仍停留在解释执行阶段</tspan>
  </text>
  <text x="840" y="272" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="18" text-anchor="middle" fill="#333333">
    <tspan x="840" dy="0">字符串替换、拼接与 UTF-16 构造</tspan>
    <tspan x="840" dy="24">路径稳定出现在热点中</tspan>
  </text>
  <text x="1180" y="266" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="17" text-anchor="middle" fill="#333333">
    <tspan x="1180" dy="0">`lu.small` 规则浮点循环</tspan>
    <tspan x="1180" dy="23">已具备向量化机会，但 LoongArch64</tspan>
    <tspan x="1180" dy="23">后端缺失最小 LSX 浮点 SIMD 支持</tspan>
  </text>

  <rect x="80" y="392" width="210" height="126" rx="8" ry="8" fill="#f3f3f3" stroke="#b5b5b5" stroke-width="1.4"/>
  <rect x="320" y="392" width="320" height="126" rx="8" ry="8" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.4"/>
  <rect x="680" y="392" width="320" height="126" rx="8" ry="8" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.4"/>
  <rect x="1040" y="392" width="280" height="126" rx="8" ry="8" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.4"/>
  <text x="185" y="461" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="24" font-weight="700" text-anchor="middle" fill="#333333">改动位置</text>
  <text x="480" y="445" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="18" text-anchor="middle" fill="#333333">
    <tspan x="480" dy="0">art/runtime/jit/</tspan>
    <tspan x="480" dy="24">jit_options.* + jit.cc</tspan>
  </text>
  <text x="840" y="445" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="18" text-anchor="middle" fill="#333333">
    <tspan x="840" dy="0">string-alloc-inl.h</tspan>
    <tspan x="840" dy="24">string.cc</tspan>
  </text>
  <text x="1180" y="439" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="17" text-anchor="middle" fill="#333333">
    <tspan x="1180" dy="0">loop_optimization.cc</tspan>
    <tspan x="1180" dy="23">code_generator_loongarch64.h</tspan>
    <tspan x="1180" dy="23">code_generator_loongarch64.cc</tspan>
  </text>

  <rect x="80" y="536" width="210" height="138" rx="8" ry="8" fill="#f3f3f3" stroke="#b5b5b5" stroke-width="1.4"/>
  <rect x="320" y="536" width="320" height="138" rx="8" ry="8" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.4"/>
  <rect x="680" y="536" width="320" height="138" rx="8" ry="8" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.4"/>
  <rect x="1040" y="536" width="280" height="138" rx="8" ry="8" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.4"/>
  <text x="185" y="613" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="24" font-weight="700" text-anchor="middle" fill="#333333">作用机制</text>
  <text x="480" y="572" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="18" text-anchor="middle" fill="#333333">
    <tspan x="480" dy="0">提前进入 baseline JIT，</tspan>
    <tspan x="480" dy="24">缩短解释器驻留时间</tspan>
  </text>
  <text x="840" y="566" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="18" text-anchor="middle" fill="#333333">
    <tspan x="840" dy="0">批量搬运替代逐元素复制，</tspan>
    <tspan x="840" dy="24">降低循环控制与分支开销</tspan>
  </text>
  <text x="1180" y="560" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="17" text-anchor="middle" fill="#333333">
    <tspan x="1180" dy="0">补齐 broadcast、load/store、</tspan>
    <tspan x="1180" dy="23">add/sub/mul 的 LSX lowering</tspan>
  </text>

  <rect x="80" y="692" width="210" height="126" rx="8" ry="8" fill="#f3f3f3" stroke="#b5b5b5" stroke-width="1.4"/>
  <rect x="320" y="692" width="320" height="126" rx="8" ry="8" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.4"/>
  <rect x="680" y="692" width="320" height="126" rx="8" ry="8" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.4"/>
  <rect x="1040" y="692" width="280" height="126" rx="8" ry="8" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.4"/>
  <text x="185" y="761" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="24" font-weight="700" text-anchor="middle" fill="#333333">主要受益工作负载</text>
  <text x="480" y="751" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="18" text-anchor="middle" fill="#333333">
    <tspan x="480" dy="0">`pmd`</tspan>
    <tspan x="480" dy="24">（方向最明确）</tspan>
  </text>
  <text x="840" y="751" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="18" text-anchor="middle" fill="#333333">
    <tspan x="840" dy="0">`pmd`、`mpegaudio`</tspan>
    <tspan x="840" dy="24">（弱正收益）</tspan>
  </text>
  <text x="1180" y="751" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="18" text-anchor="middle" fill="#333333">
    <tspan x="1180" dy="0">`lu.small`</tspan>
    <tspan x="1180" dy="24">（显著稳定收益）</tspan>
  </text>

  <rect x="80" y="836" width="210" height="104" rx="8" ry="8" fill="#f3f3f3" stroke="#b5b5b5" stroke-width="1.4"/>
  <rect x="320" y="836" width="320" height="104" rx="8" ry="8" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.4"/>
  <rect x="680" y="836" width="320" height="104" rx="8" ry="8" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.4"/>
  <rect x="1040" y="836" width="280" height="104" rx="8" ry="8" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.4"/>
  <text x="185" y="896" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="24" font-weight="700" text-anchor="middle" fill="#333333">结论强度</text>
  <text x="480" y="894" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="22" font-weight="700" text-anchor="middle" fill="#8a5200">方向明确，波动较大</text>
  <text x="840" y="894" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="22" font-weight="700" text-anchor="middle" fill="#2d5a87">定向微优化</text>
  <text x="1180" y="894" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="22" font-weight="700" text-anchor="middle" fill="#2e6d2e">稳定主结论</text>

  <rect x="80" y="954" width="1240" height="28" rx="6" ry="6" fill="#f3f3f3" stroke="#b5b5b5" stroke-width="1.2"/>
  <text x="700" y="973" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="16" text-anchor="middle" fill="#555555">正文只保留这三项正式方案；其它候选方向、补充消融与候选筛选结果统一转入附录。</text>
</svg>
