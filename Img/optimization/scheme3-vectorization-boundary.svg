<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="930" viewBox="0 0 1400 930">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 z" fill="#666666"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="100%" height="100%" fill="#ffffff"/>
  <rect x="40" y="40" width="1320" height="850" rx="12" ry="12" fill="#fafafa" stroke="#b5b5b5" stroke-width="1.6"/>

  <text x="80" y="82" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="28" font-weight="700" fill="#333333">方案三：向量化启用边界与最小能力范围</text>

  <rect x="90" y="150" width="300" height="136" rx="12" ry="12" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.6"/>
  <text x="240" y="192" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="25" font-weight="700" text-anchor="middle" fill="#333333">规则浮点循环</text>
  <text x="240" y="225" font-family="Menlo, Monaco, monospace" font-size="18" text-anchor="middle" fill="#555555">Aii[jj] -= AiiJ * Aj[jj]</text>
  <text x="240" y="255" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="18" text-anchor="middle" fill="#555555">连续数组访问、无复杂控制流</text>

  <rect x="470" y="150" width="330" height="136" rx="12" ry="12" fill="#eef5fd" stroke="#6c8ebf" stroke-width="1.6"/>
  <text x="635" y="192" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="25" font-weight="700" text-anchor="middle" fill="#333333">LoongArch64 正式入口</text>
  <text x="635" y="225" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="18" text-anchor="middle" fill="#555555">只开启正文正式版本真正需要的</text>
  <text x="635" y="253" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="18" text-anchor="middle" fill="#555555">最小可用浮点 SIMD 子集</text>

  <rect x="880" y="150" width="390" height="136" rx="12" ry="12" fill="#d8f0d2" stroke="#82b366" stroke-width="1.6"/>
  <text x="1075" y="188" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="25" font-weight="700" text-anchor="middle" fill="#333333">LSX 最小能力集合</text>
  <text x="1075" y="222" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="18" text-anchor="middle" fill="#555555">标量广播 + 向量 load/store + 向量 add/sub/mul</text>
  <text x="1075" y="252" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="18" text-anchor="middle" fill="#555555">把规则数值内核真正落成向量机器码</text>

  <line x1="390" y1="218" x2="470" y2="218" stroke="#666666" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="800" y1="218" x2="880" y2="218" stroke="#666666" stroke-width="2.2" marker-end="url(#arrow)"/>

  <rect x="90" y="350" width="590" height="400" rx="12" ry="12" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.4"/>
  <rect x="720" y="350" width="590" height="400" rx="12" ry="12" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.4"/>

  <rect x="120" y="380" width="530" height="58" rx="10" ry="10" fill="#d8f0d2" stroke="#82b366" stroke-width="1.2"/>
  <rect x="750" y="380" width="530" height="58" rx="10" ry="10" fill="#fff2cc" stroke="#d6b656" stroke-width="1.2"/>
  <text x="385" y="417" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="25" font-weight="700" text-anchor="middle" fill="#333333">正文正式版本明确支持</text>
  <text x="1015" y="417" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="25" font-weight="700" text-anchor="middle" fill="#333333">暂不写入正文主结论</text>

  <rect x="140" y="462" width="230" height="102" rx="10" ry="10" fill="#eef7ec" stroke="#82b366" stroke-width="1.2"/>
  <rect x="390" y="462" width="230" height="102" rx="10" ry="10" fill="#eef7ec" stroke="#82b366" stroke-width="1.2"/>
  <rect x="140" y="590" width="230" height="102" rx="10" ry="10" fill="#eef7ec" stroke="#82b366" stroke-width="1.2"/>
  <rect x="390" y="590" width="230" height="102" rx="10" ry="10" fill="#eef7ec" stroke="#82b366" stroke-width="1.2"/>
  <text x="255" y="500" font-family="Menlo, Monaco, monospace" font-size="18" text-anchor="middle" fill="#2e6d2e">float32 x 4</text>
  <text x="255" y="530" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="18" text-anchor="middle" fill="#555555">128-bit LSX 浮点向量</text>
  <text x="505" y="500" font-family="Menlo, Monaco, monospace" font-size="18" text-anchor="middle" fill="#2e6d2e">float64 x 2</text>
  <text x="505" y="530" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="18" text-anchor="middle" fill="#555555">正文最关键的双精度路径</text>
  <text x="255" y="628" font-family="Menlo, Monaco, monospace" font-size="18" text-anchor="middle" fill="#2e6d2e">HVecReplicateScalar</text>
  <text x="255" y="658" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="18" text-anchor="middle" fill="#555555">广播标量系数</text>
  <text x="505" y="628" font-family="Menlo, Monaco, monospace" font-size="18" text-anchor="middle" fill="#2e6d2e">Load / Store / Add / Sub / Mul</text>
  <text x="505" y="658" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="18" text-anchor="middle" fill="#555555">足以覆盖 `lu.small` 的核心模式</text>

  <rect x="770" y="462" width="230" height="102" rx="10" ry="10" fill="#fff8ef" stroke="#d6b656" stroke-width="1.2"/>
  <rect x="1020" y="462" width="230" height="102" rx="10" ry="10" fill="#fff8ef" stroke="#d6b656" stroke-width="1.2"/>
  <rect x="770" y="590" width="230" height="102" rx="10" ry="10" fill="#fff8ef" stroke="#d6b656" stroke-width="1.2"/>
  <rect x="1020" y="590" width="230" height="102" rx="10" ry="10" fill="#eef5fd" stroke="#6c8ebf" stroke-width="1.2"/>
  <text x="885" y="500" font-family="Menlo, Monaco, monospace" font-size="18" text-anchor="middle" fill="#7a5a00">predication / reduction</text>
  <text x="885" y="530" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="18" text-anchor="middle" fill="#555555">复杂控制流和归约不纳入正文</text>
  <text x="1135" y="500" font-family="Menlo, Monaco, monospace" font-size="18" text-anchor="middle" fill="#7a5a00">更复杂 idiom 与融合模式</text>
  <text x="1135" y="530" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="18" text-anchor="middle" fill="#555555">需额外验证收益边界</text>
  <text x="885" y="628" font-family="Menlo, Monaco, monospace" font-size="18" text-anchor="middle" fill="#7a5a00">全部默认开启</text>
  <text x="885" y="658" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="18" text-anchor="middle" fill="#555555">正文不做这样的强结论</text>
  <text x="1135" y="628" font-family="Menlo, Monaco, monospace" font-size="18" text-anchor="middle" fill="#355b88">S2 完整覆盖候选版</text>
  <text x="1135" y="658" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="18" text-anchor="middle" fill="#555555">转入附录 A.3 做补充消融</text>

  <rect x="90" y="788" width="1220" height="72" rx="12" ry="12" fill="#f3f3f3" stroke="#b5b5b5" stroke-width="1.4"/>
  <text x="700" y="821" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="22" font-weight="700" text-anchor="middle" fill="#333333">图示含义</text>
  <text x="700" y="848" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="19" text-anchor="middle" fill="#555555">正文方案三的核心不是“LoongArch64 SIMD 已经全面完成”，而是“最小可用的浮点 SIMD 落地路径已经足以解释 `lu.small` 的显著收益”。</text>
</svg>
