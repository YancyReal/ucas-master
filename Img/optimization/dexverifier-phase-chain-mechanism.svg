<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 z" fill="#666666"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="980" fill="#ffffff"/>
  <rect x="40" y="40" width="1320" height="900" rx="12" ry="12" fill="#fafafa" stroke="#b5b5b5" stroke-width="1.6"/>

  <text x="80" y="82" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="28" font-weight="700" fill="#333333">DexFileVerifier 阶段链的机制拆解</text>

  <rect x="92" y="108" width="1218" height="62" rx="10" ry="10" fill="#f3f3f3" stroke="#c2c2c2" stroke-width="1.2"/>
  <text x="701" y="146" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="20" text-anchor="middle" fill="#555555">目标 workload 为 `startup.helloworld`，主收益沿 container probing、UTF-8 校验和 LEB128 解码这条启动期主链逐段显现</text>

  <rect x="92" y="214" width="1218" height="224" rx="12" ry="12" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.4"/>
  <text x="701" y="252" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="25" font-weight="700" text-anchor="middle" fill="#333333">baseline 启动期热点链</text>

  <rect x="134" y="286" width="320" height="108" rx="12" ry="12" fill="#eef5fd" stroke="#6c8ebf" stroke-width="1.5"/>
  <rect x="540" y="286" width="320" height="108" rx="12" ry="12" fill="#fff8ef" stroke="#d79b00" stroke-width="1.5"/>
  <rect x="946" y="286" width="320" height="108" rx="12" ry="12" fill="#eef7ec" stroke="#82b366" stroke-width="1.5"/>

  <text x="294" y="324" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="24" font-weight="700" text-anchor="middle" fill="#333333">container probing</text>
  <text x="294" y="354" font-family="Menlo, Monaco, monospace" font-size="17" text-anchor="middle" fill="#355b88">OffsetToPtr / FindIndexImpl / ElementForIndex</text>
  <text x="294" y="382" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="18" text-anchor="middle" fill="#555555">Hash 风格查询与随机访问是首要热点来源</text>

  <text x="700" y="324" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="24" font-weight="700" text-anchor="middle" fill="#333333">UTF-8 与字符串校验</text>
  <text x="700" y="354" font-family="Menlo, Monaco, monospace" font-size="17" text-anchor="middle" fill="#7a5a00">CheckIntraDebugInfoItem / UTF helpers</text>
  <text x="700" y="382" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="18" text-anchor="middle" fill="#555555">ASCII fast path 与查表可作为次级增益来源</text>

  <text x="1106" y="324" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="24" font-weight="700" text-anchor="middle" fill="#333333">LEB128 顺序解码</text>
  <text x="1106" y="354" font-family="Menlo, Monaco, monospace" font-size="17" text-anchor="middle" fill="#2e6d2e">DecodeUnsignedLeb128 fast path</text>
  <text x="1106" y="382" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="18" text-anchor="middle" fill="#555555">主链压低后才显露的尾段细粒度成本</text>

  <line x1="454" y1="340" x2="540" y2="340" stroke="#666666" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="860" y1="340" x2="946" y2="340" stroke="#666666" stroke-width="2.2" marker-end="url(#arrow)"/>

  <rect x="388" y="404" width="624" height="20" rx="6" ry="6" fill="#f3f3f3" stroke="#c2c2c2" stroke-width="1.0"/>
  <text x="700" y="418" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="16" text-anchor="middle" fill="#666666">启动期 flamegraph 中相关 hot share 合计约 5.3%，因此可以形成独立的启动期收益链</text>

  <rect x="92" y="478" width="1218" height="386" rx="12" ry="12" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.4"/>
  <text x="701" y="518" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="25" font-weight="700" text-anchor="middle" fill="#333333">四阶段推进顺序与收益角色</text>

  <rect x="112" y="570" width="250" height="214" rx="12" ry="12" fill="#fff8ef" stroke="#d79b00" stroke-width="1.5"/>
  <rect x="392" y="548" width="280" height="258" rx="12" ry="12" fill="#eef7ec" stroke="#82b366" stroke-width="1.7"/>
  <rect x="702" y="570" width="250" height="214" rx="12" ry="12" fill="#eef5fd" stroke="#6c8ebf" stroke-width="1.5"/>
  <rect x="982" y="570" width="250" height="214" rx="12" ry="12" fill="#fcefe7" stroke="#d57a2a" stroke-width="1.5"/>

  <text x="237" y="610" font-family="Menlo, Monaco, monospace" font-size="20" text-anchor="middle" fill="#7a5a00">phase1</text>
  <text x="237" y="642" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="22" font-weight="700" text-anchor="middle" fill="#333333">准备性压缩</text>
  <text x="237" y="674" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="18" text-anchor="middle" fill="#555555">缓存边界、热点 helper 内联、</text>
  <text x="237" y="700" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="18" text-anchor="middle" fill="#555555">预留类型映射容量</text>
  <text x="237" y="732" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="18" text-anchor="middle" fill="#555555">只压低前置与框架成本，</text>
  <text x="237" y="758" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="18" text-anchor="middle" fill="#555555">尚未形成稳定 benchmark 收益</text>

  <text x="532" y="592" font-family="Menlo, Monaco, monospace" font-size="20" text-anchor="middle" fill="#2e6d2e">phase12</text>
  <text x="532" y="626" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="24" font-weight="700" text-anchor="middle" fill="#333333">首个稳定有效阶段</text>
  <text x="532" y="660" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="18" text-anchor="middle" fill="#555555">将 `offset_to_type_map_` 改为</text>
  <text x="532" y="686" font-family="Menlo, Monaco, monospace" font-size="17" text-anchor="middle" fill="#2e6d2e">vector + lower_bound</text>
  <text x="532" y="716" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="18" text-anchor="middle" fill="#555555">直接压低 probing 链与随机访问成本</text>
  <rect x="434" y="736" width="196" height="28" rx="8" ry="8" fill="#d8f0d2" stroke="#82b366" stroke-width="1.1"/>
  <text x="532" y="756" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="17" text-anchor="middle" fill="#2e6d2e">主目标均值 +4.83%</text>

  <text x="827" y="610" font-family="Menlo, Monaco, monospace" font-size="20" text-anchor="middle" fill="#355b88">phase123</text>
  <text x="827" y="642" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="22" font-weight="700" text-anchor="middle" fill="#333333">收益巩固阶段</text>
  <text x="827" y="674" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="18" text-anchor="middle" fill="#555555">UTF-8 查表、prefetch 与</text>
  <text x="827" y="700" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="18" text-anchor="middle" fill="#555555">ASCII fast path</text>
  <text x="827" y="732" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="18" text-anchor="middle" fill="#555555">继续保留正收益，但不形成新的大台阶</text>
  <text x="827" y="758" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="18" text-anchor="middle" fill="#555555">更适合作为主收益后的补强项</text>

  <text x="1107" y="610" font-family="Menlo, Monaco, monospace" font-size="20" text-anchor="middle" fill="#a15820">phase1234</text>
  <text x="1107" y="642" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="22" font-weight="700" text-anchor="middle" fill="#333333">最终最优点</text>
  <text x="1107" y="674" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="18" text-anchor="middle" fill="#555555">补入 LEB128 fast path，</text>
  <text x="1107" y="700" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="18" text-anchor="middle" fill="#555555">压低顺序元数据解码成本</text>
  <rect x="1009" y="720" width="196" height="28" rx="8" ry="8" fill="#fcefe7" stroke="#d57a2a" stroke-width="1.1"/>
  <text x="1107" y="740" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="17" text-anchor="middle" fill="#a15820">主目标均值 +5.46%</text>
  <text x="1107" y="772" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="18" text-anchor="middle" fill="#555555">在主链压低后兑现尾段额外收益</text>

  <line x1="362" y1="677" x2="392" y2="677" stroke="#666666" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="672" y1="677" x2="702" y2="677" stroke="#666666" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="952" y1="677" x2="982" y2="677" stroke="#666666" stroke-width="2.2" marker-end="url(#arrow)"/>

  <line x1="294" y1="394" x2="532" y2="534" stroke="#6c8ebf" stroke-width="2.0" stroke-dasharray="6,5"/>
  <line x1="700" y1="394" x2="827" y2="556" stroke="#d79b00" stroke-width="2.0" stroke-dasharray="6,5"/>
  <line x1="1106" y1="394" x2="1107" y2="556" stroke="#82b366" stroke-width="2.0" stroke-dasharray="6,5"/>

  <rect x="112" y="830" width="1120" height="28" rx="8" ry="8" fill="#f3f3f3" stroke="#b5b5b5" stroke-width="1.1"/>
  <text x="672" y="850" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="17" text-anchor="middle" fill="#555555">结论：真正决定阶段链收益拐点的是 container probing 链的改写；UTF-8 与 LEB128 更像沿主链推进后的补强项</text>
</svg>
