<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1080" viewBox="0 0 1480 1080">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 z" fill="#666666"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="100%" height="100%" fill="#ffffff"/>
  <rect x="40" y="40" width="1400" height="1000" rx="12" ry="12" fill="#fafafa" stroke="#b5b5b5" stroke-width="1.6"/>

  <text x="80" y="82" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="28" font-weight="700" fill="#333333">候选方案筛选关系图</text>

  <rect x="90" y="120" width="400" height="800" rx="12" ry="12" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.4"/>
  <rect x="540" y="120" width="400" height="800" rx="12" ry="12" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.4"/>
  <rect x="990" y="120" width="360" height="800" rx="12" ry="12" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.4"/>

  <rect x="120" y="150" width="340" height="66" rx="10" ry="10" fill="#fde2cf" stroke="#d79b00" stroke-width="1.4"/>
  <rect x="570" y="150" width="340" height="66" rx="10" ry="10" fill="#dce9f9" stroke="#6c8ebf" stroke-width="1.4"/>
  <rect x="1020" y="150" width="300" height="66" rx="10" ry="10" fill="#d8f0d2" stroke="#82b366" stroke-width="1.4"/>
  <text x="290" y="192" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="26" font-weight="700" text-anchor="middle" fill="#333333">JIT 时机与解释器</text>
  <text x="740" y="192" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="26" font-weight="700" text-anchor="middle" fill="#333333">运行时字符串与搬运</text>
  <text x="1170" y="192" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="26" font-weight="700" text-anchor="middle" fill="#333333">LoongArch64 向量化</text>

  <rect x="130" y="248" width="320" height="86" rx="10" ry="10" fill="#fff8ef" stroke="#d79b00" stroke-width="1.2"/>
  <rect x="580" y="248" width="320" height="86" rx="10" ry="10" fill="#eef5fd" stroke="#6c8ebf" stroke-width="1.2"/>
  <rect x="1030" y="248" width="280" height="86" rx="10" ry="10" fill="#eef7ec" stroke="#82b366" stroke-width="1.2"/>
  <text x="290" y="282" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="20" font-weight="700" text-anchor="middle" fill="#333333">研究问题</text>
  <text x="290" y="310" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="17" text-anchor="middle" fill="#555555">如何让短生命周期 workload</text>
  <text x="290" y="334" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="17" text-anchor="middle" fill="#555555">更早脱离解释器</text>
  <text x="740" y="282" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="20" font-weight="700" text-anchor="middle" fill="#333333">研究问题</text>
  <text x="740" y="310" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="17" text-anchor="middle" fill="#555555">如何降低高频短字符串路径的</text>
  <text x="740" y="334" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="17" text-anchor="middle" fill="#555555">固定复制成本</text>
  <text x="1170" y="282" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="20" font-weight="700" text-anchor="middle" fill="#333333">研究问题</text>
  <text x="1170" y="310" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="17" text-anchor="middle" fill="#555555">如何让规则数值循环</text>
  <text x="1170" y="334" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="17" text-anchor="middle" fill="#555555">真正落成向量机器码</text>

  <rect x="130" y="386" width="320" height="98" rx="10" ry="10" fill="#d8f0d2" stroke="#82b366" stroke-width="1.3"/>
  <rect x="580" y="386" width="320" height="98" rx="10" ry="10" fill="#d8f0d2" stroke="#82b366" stroke-width="1.3"/>
  <rect x="1030" y="386" width="280" height="98" rx="10" ry="10" fill="#d8f0d2" stroke="#82b366" stroke-width="1.3"/>
  <text x="290" y="420" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="19" font-weight="700" text-anchor="middle" fill="#333333">正文保留</text>
  <text x="290" y="450" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="18" text-anchor="middle" fill="#2e6d2e">方案一：只调第一层</text>
  <text x="290" y="476" font-family="Menlo, Monaco, monospace" font-size="16" text-anchor="middle" fill="#2e6d2e">warmup_threshold</text>
  <text x="740" y="420" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="19" font-weight="700" text-anchor="middle" fill="#333333">正文保留</text>
  <text x="740" y="450" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="18" text-anchor="middle" fill="#2e6d2e">方案二：字符串热路径</text>
  <text x="740" y="476" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="18" text-anchor="middle" fill="#2e6d2e">8 路展开搬运</text>
  <text x="1170" y="420" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="19" font-weight="700" text-anchor="middle" fill="#333333">正文保留</text>
  <text x="1170" y="450" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="18" text-anchor="middle" fill="#2e6d2e">方案三：最小 LSX</text>
  <text x="1170" y="476" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="18" text-anchor="middle" fill="#2e6d2e">浮点 SIMD lowering</text>

  <line x1="290" y1="334" x2="290" y2="386" stroke="#666666" stroke-width="2.0" marker-end="url(#arrow)"/>
  <line x1="740" y1="334" x2="740" y2="386" stroke="#666666" stroke-width="2.0" marker-end="url(#arrow)"/>
  <line x1="1170" y1="334" x2="1170" y2="386" stroke="#666666" stroke-width="2.0" marker-end="url(#arrow)"/>

  <rect x="130" y="528" width="320" height="86" rx="10" ry="10" fill="#f5f5f5" stroke="#b5b5b5" stroke-width="1.2"/>
  <rect x="130" y="632" width="320" height="86" rx="10" ry="10" fill="#f5f5f5" stroke="#b5b5b5" stroke-width="1.2"/>
  <rect x="130" y="736" width="320" height="86" rx="10" ry="10" fill="#f5f5f5" stroke="#b5b5b5" stroke-width="1.2"/>
  <text x="290" y="562" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="18" font-weight="700" text-anchor="middle" fill="#333333">JIT 优化重编译阈值</text>
  <text x="290" y="590" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="16" text-anchor="middle" fill="#666666">介入过晚，没有解决第一层进入时机</text>
  <text x="290" y="666" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="18" font-weight="700" text-anchor="middle" fill="#333333">OSR 热路径内联</text>
  <text x="290" y="694" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="16" text-anchor="middle" fill="#666666">局部成本下降，但代码体积变大</text>
  <text x="290" y="770" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="18" font-weight="700" text-anchor="middle" fill="#333333">解释器快路径扩展</text>
  <text x="290" y="798" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="16" text-anchor="middle" fill="#666666">命中局部解析热点，不是主导瓶颈</text>

  <rect x="580" y="528" width="320" height="86" rx="10" ry="10" fill="#f5f5f5" stroke="#b5b5b5" stroke-width="1.2"/>
  <rect x="580" y="632" width="320" height="86" rx="10" ry="10" fill="#f5f5f5" stroke="#b5b5b5" stroke-width="1.2"/>
  <rect x="580" y="736" width="320" height="86" rx="10" ry="10" fill="#f5f5f5" stroke="#b5b5b5" stroke-width="1.2"/>
  <text x="740" y="562" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="18" font-weight="700" text-anchor="middle" fill="#333333">原始数组批量搬运</text>
  <text x="740" y="590" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="16" text-anchor="middle" fill="#666666">命中的是次级热点，不足以支撑总收益</text>
  <text x="740" y="666" font-family="Menlo, Monaco, monospace" font-size="18" text-anchor="middle" fill="#333333">memcpy</text>
  <text x="740" y="694" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="16" text-anchor="middle" fill="#666666">没有证据表明 workload 会稳定落到该入口</text>
  <text x="740" y="770" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="18" font-weight="700" text-anchor="middle" fill="#333333">DexFileVerifier / CRC32</text>
  <text x="740" y="798" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="16" text-anchor="middle" fill="#666666">更偏启动期或局部热点，不构成正文主线</text>

  <rect x="1030" y="528" width="280" height="86" rx="10" ry="10" fill="#f5f5f5" stroke="#b5b5b5" stroke-width="1.2"/>
  <rect x="1030" y="632" width="280" height="86" rx="10" ry="10" fill="#eef5fd" stroke="#6c8ebf" stroke-width="1.2"/>
  <text x="1170" y="562" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="18" font-weight="700" text-anchor="middle" fill="#333333">标量循环展开增强</text>
  <text x="1170" y="590" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="16" text-anchor="middle" fill="#666666">增加标量代码体积，但没有形成向量流</text>
  <text x="1170" y="666" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="18" font-weight="700" text-anchor="middle" fill="#333333">完整 SIMD 覆盖版 S2</text>
  <text x="1170" y="694" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="16" text-anchor="middle" fill="#355b88">关键 workload 更强，但整体均值尚未超 S1</text>

  <line x1="290" y1="484" x2="290" y2="528" stroke="#666666" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="740" y1="484" x2="740" y2="528" stroke="#666666" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="1170" y1="484" x2="1170" y2="528" stroke="#666666" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="180" y="950" width="1120" height="56" rx="10" ry="10" fill="#f3f3f3" stroke="#b5b5b5" stroke-width="1.2"/>
  <text x="740" y="972" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="20" font-weight="700" text-anchor="middle" fill="#333333">统一筛选标准</text>
  <text x="740" y="996" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="18" text-anchor="middle" fill="#555555">命中正式 workload 主路径 + 目标机回归通过 + 单方案结果可解释 + 结论边界清楚</text>
</svg>
