<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 z" fill="#666666"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="100%" height="100%" fill="#ffffff"/>
  <rect x="40" y="40" width="1320" height="900" rx="12" ry="12" fill="#fafafa" stroke="#b5b5b5" stroke-width="1.6"/>

  <text x="80" y="82" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="28" font-weight="700" fill="#333333">方案二：字符串复制路径对照与 8 路展开思路</text>

  <rect x="120" y="110" width="240" height="86" rx="10" ry="10" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.4"/>
  <rect x="408" y="110" width="240" height="86" rx="10" ry="10" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.4"/>
  <rect x="696" y="110" width="240" height="86" rx="10" ry="10" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.4"/>
  <rect x="984" y="110" width="280" height="86" rx="10" ry="10" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.4"/>
  <text x="240" y="145" font-family="Menlo, Monaco, monospace" font-size="19" text-anchor="middle" fill="#333333">String::DoReplace()</text>
  <text x="240" y="173" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="17" text-anchor="middle" fill="#555555">替换路径</text>
  <text x="528" y="145" font-family="Menlo, Monaco, monospace" font-size="19" text-anchor="middle" fill="#333333">String::DoConcat()</text>
  <text x="528" y="173" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="17" text-anchor="middle" fill="#555555">拼接路径</text>
  <text x="816" y="145" font-family="Menlo, Monaco, monospace" font-size="19" text-anchor="middle" fill="#333333">AllocFromUtf16()</text>
  <text x="816" y="173" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="17" text-anchor="middle" fill="#555555">UTF-16 构造</text>
  <text x="1124" y="145" font-family="Menlo, Monaco, monospace" font-size="19" text-anchor="middle" fill="#333333">StringBuilderAppend</text>
  <text x="1124" y="173" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="17" text-anchor="middle" fill="#555555">追加写入路径</text>

  <line x1="240" y1="196" x2="240" y2="240" stroke="#666666" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="528" y1="196" x2="528" y2="240" stroke="#666666" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="816" y1="196" x2="816" y2="240" stroke="#666666" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="1124" y1="196" x2="1124" y2="240" stroke="#666666" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="90" y="250" width="560" height="392" rx="12" ry="12" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.4"/>
  <rect x="750" y="250" width="560" height="392" rx="12" ry="12" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.4"/>

  <rect x="120" y="280" width="500" height="56" rx="10" ry="10" fill="#f3f3f3" stroke="#b5b5b5" stroke-width="1.2"/>
  <rect x="780" y="280" width="500" height="56" rx="10" ry="10" fill="#dce9f9" stroke="#6c8ebf" stroke-width="1.2"/>
  <text x="370" y="317" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="25" font-weight="700" text-anchor="middle" fill="#333333">原始路径</text>
  <text x="1030" y="317" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="25" font-weight="700" text-anchor="middle" fill="#333333">方案二路径</text>

  <rect x="138" y="362" width="464" height="74" rx="10" ry="10" fill="#fafafa" stroke="#b5b5b5" stroke-width="1.2"/>
  <text x="370" y="392" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="20" font-weight="700" text-anchor="middle" fill="#333333">逐元素复制或替换</text>
  <text x="370" y="420" font-family="Menlo, Monaco, monospace" font-size="17" text-anchor="middle" fill="#666666">for (...) / std::transform(...)</text>

  <rect x="138" y="458" width="464" height="74" rx="10" ry="10" fill="#fafafa" stroke="#b5b5b5" stroke-width="1.2"/>
  <text x="370" y="488" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="20" font-weight="700" text-anchor="middle" fill="#333333">每轮都要处理索引和分支</text>
  <text x="370" y="516" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="18" text-anchor="middle" fill="#555555">压缩字符串 / 非压缩字符串 / UTF-16 bytes 转换反复出现</text>

  <rect x="138" y="554" width="464" height="58" rx="10" ry="10" fill="#fff2cc" stroke="#d6b656" stroke-width="1.2"/>
  <text x="370" y="591" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="20" text-anchor="middle" fill="#7a5a00">短字符串频繁调用时，循环框架成本不容易被摊薄</text>

  <line x1="370" y1="336" x2="370" y2="362" stroke="#666666" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="370" y1="436" x2="370" y2="458" stroke="#666666" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="370" y1="532" x2="370" y2="554" stroke="#666666" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="798" y="362" width="464" height="74" rx="10" ry="10" fill="#eef5fd" stroke="#6c8ebf" stroke-width="1.2"/>
  <text x="1030" y="392" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="20" font-weight="700" text-anchor="middle" fill="#333333">先保持原有语义和压缩判定</text>
  <text x="1030" y="420" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="18" text-anchor="middle" fill="#555555">只改复制实现，不改字符串对象布局</text>

  <rect x="798" y="458" width="464" height="74" rx="10" ry="10" fill="#eef5fd" stroke="#6c8ebf" stroke-width="1.2"/>
  <text x="1030" y="488" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="20" font-weight="700" text-anchor="middle" fill="#333333">8 路 helper 批量搬运</text>
  <text x="1030" y="516" font-family="Menlo, Monaco, monospace" font-size="17" text-anchor="middle" fill="#355b88">CopyBytes / CopyUtf16ToBytes / ReplaceChars</text>

  <rect x="798" y="554" width="464" height="58" rx="10" ry="10" fill="#d8f0d2" stroke="#82b366" stroke-width="1.2"/>
  <text x="1030" y="591" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="20" text-anchor="middle" fill="#2e6d2e">把额外开销收缩到更少的循环轮次，再用尾部路径处理剩余字符</text>

  <line x1="1030" y1="336" x2="1030" y2="362" stroke="#666666" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="1030" y1="436" x2="1030" y2="458" stroke="#666666" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="1030" y1="532" x2="1030" y2="554" stroke="#666666" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="110" y="676" width="1180" height="176" rx="12" ry="12" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.4"/>
  <text x="700" y="714" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="26" font-weight="700" text-anchor="middle" fill="#333333">边界与伪代码</text>

  <rect x="150" y="740" width="520" height="82" rx="10" ry="10" fill="#f7f7f7" stroke="#b5b5b5" stroke-width="1.2"/>
  <text x="178" y="772" font-family="Menlo, Monaco, monospace" font-size="20" fill="#333333">for (; i + 8 &lt;= len; i += 8) {</text>
  <text x="208" y="802" font-family="Menlo, Monaco, monospace" font-size="20" fill="#333333">copy_or_replace_8(dst + i, src + i);</text>
  <text x="178" y="832" font-family="Menlo, Monaco, monospace" font-size="20" fill="#333333">}</text>

  <rect x="730" y="740" width="520" height="82" rx="10" ry="10" fill="#fff8ef" stroke="#d79b00" stroke-width="1.2"/>
  <text x="760" y="772" font-family="Menlo, Monaco, monospace" font-size="20" fill="#7a5a00">for (; i &lt; len; ++i) {</text>
  <text x="790" y="802" font-family="Menlo, Monaco, monospace" font-size="20" fill="#7a5a00">copy_or_replace_tail(dst + i, src + i);</text>
  <text x="760" y="832" font-family="Menlo, Monaco, monospace" font-size="20" fill="#7a5a00">}</text>

  <rect x="210" y="860" width="980" height="34" rx="8" ry="8" fill="#f3f3f3" stroke="#b5b5b5" stroke-width="1.0"/>
  <text x="700" y="883" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="18" text-anchor="middle" fill="#555555">关键约束：当 `length &lt; 8` 时直接走尾部路径，避免展开循环中的无符号下溢与越界访问。</text>
</svg>
