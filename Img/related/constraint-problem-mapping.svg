<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="940" viewBox="0 0 1400 940">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 z" fill="#666666"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="940" fill="#ffffff"/>
  <rect x="40" y="40" width="1320" height="860" rx="12" ry="12" fill="#fafafa" stroke="#b5b5b5" stroke-width="1.6"/>

  <text x="80" y="82" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="28" font-weight="700" fill="#333333">LoongArch 约束到后文问题的映射关系</text>

  <rect x="86" y="108" width="1228" height="56" rx="10" ry="10" fill="#f3f3f3" stroke="#c2c2c2" stroke-width="1.2"/>
  <text x="700" y="143" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="20" text-anchor="middle" fill="#555555">本章只保留会在第 6 章和第 7 章真正被用来解释实验结果的约束，不把体系结构手册平铺成背景材料</text>

  <text x="220" y="202" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="22" font-weight="700" text-anchor="middle" fill="#666666">平台约束</text>
  <text x="700" y="202" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="22" font-weight="700" text-anchor="middle" fill="#666666">主导成本表现</text>
  <text x="1165" y="202" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="22" font-weight="700" text-anchor="middle" fill="#666666">后文优化问题</text>

  <rect x="86" y="246" width="290" height="158" rx="12" ry="12" fill="#eef5fd" stroke="#6c8ebf" stroke-width="1.6"/>
  <rect x="86" y="440" width="290" height="158" rx="12" ry="12" fill="#fff8ef" stroke="#d79b00" stroke-width="1.6"/>
  <rect x="86" y="634" width="290" height="158" rx="12" ry="12" fill="#eef7ec" stroke="#82b366" stroke-width="1.6"/>

  <text x="231" y="288" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="24" font-weight="700" text-anchor="middle" fill="#333333">控制流与 JIT 约束</text>
  <text x="231" y="322" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="18" text-anchor="middle" fill="#555555">寄存器约定、跳转修补、</text>
  <text x="231" y="348" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="18" text-anchor="middle" fill="#555555">trampoline 与调试信息成本</text>
  <text x="231" y="376" font-family="Menlo, Monaco, monospace" font-size="17" text-anchor="middle" fill="#355b88">interpreter - baseline JIT</text>

  <text x="231" y="482" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="24" font-weight="700" text-anchor="middle" fill="#333333">数据搬移与访存约束</text>
  <text x="231" y="516" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="18" text-anchor="middle" fill="#555555">显式 load/store、地址更新、</text>
  <text x="231" y="542" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="18" text-anchor="middle" fill="#555555">边界检查与对象布局访问</text>
  <text x="231" y="570" font-family="Menlo, Monaco, monospace" font-size="17" text-anchor="middle" fill="#7a5a00">small copy + fixed semantics</text>

  <text x="231" y="676" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="24" font-weight="700" text-anchor="middle" fill="#333333">LSX 向量与 lowering 约束</text>
  <text x="231" y="710" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="18" text-anchor="middle" fill="#555555">向量寄存器、类型匹配、</text>
  <text x="231" y="736" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="18" text-anchor="middle" fill="#555555">对齐边界与 IR 到汇编映射</text>
  <text x="231" y="764" font-family="Menlo, Monaco, monospace" font-size="17" text-anchor="middle" fill="#2e6d2e">HVec - LSX instructions</text>

  <rect x="510" y="246" width="380" height="158" rx="12" ry="12" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.4"/>
  <rect x="510" y="440" width="380" height="158" rx="12" ry="12" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.4"/>
  <rect x="510" y="634" width="380" height="158" rx="12" ry="12" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.4"/>

  <text x="700" y="284" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="24" font-weight="700" text-anchor="middle" fill="#333333">解释器驻留与编译固定成本</text>
  <text x="700" y="318" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="18" text-anchor="middle" fill="#555555">短生命周期 workload 对第一层 JIT 进入时机最敏感</text>
  <text x="700" y="346" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="18" text-anchor="middle" fill="#555555">若 baseline JIT 发生过晚，第二层优化难以回本</text>
  <rect x="585" y="364" width="230" height="26" rx="7" ry="7" fill="#eef5fd" stroke="#6c8ebf" stroke-width="1.1"/>
  <text x="700" y="382" font-family="Menlo, Monaco, monospace" font-size="16" text-anchor="middle" fill="#355b88">workload: pmd</text>

  <text x="700" y="478" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="24" font-weight="700" text-anchor="middle" fill="#333333">高频短串路径中的框架开销</text>
  <text x="700" y="512" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="18" text-anchor="middle" fill="#555555">循环控制、索引更新与边界判断会在小长度复制里放大</text>
  <text x="700" y="540" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="18" text-anchor="middle" fill="#555555">热点是否稳定出现，决定其能否转化为 benchmark 级微收益</text>
  <rect x="558" y="558" width="284" height="26" rx="7" ry="7" fill="#fff2cc" stroke="#d6b656" stroke-width="1.1"/>
  <text x="700" y="576" font-family="Menlo, Monaco, monospace" font-size="16" text-anchor="middle" fill="#7a5a00">workload: pmd / mpegaudio</text>

  <text x="700" y="672" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="24" font-weight="700" text-anchor="middle" fill="#333333">规则浮点循环中的数据并行机会</text>
  <text x="700" y="706" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="18" text-anchor="middle" fill="#555555">只有当向量 IR、寄存器类型和目标指令可以稳定对齐时</text>
  <text x="700" y="734" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="18" text-anchor="middle" fill="#555555">规则数值内核才可能从标量路径提升为可验证的 LSX 路径</text>
  <rect x="544" y="752" width="312" height="26" rx="7" ry="7" fill="#eef7ec" stroke="#82b366" stroke-width="1.1"/>
  <text x="700" y="770" font-family="Menlo, Monaco, monospace" font-size="16" text-anchor="middle" fill="#2e6d2e">workload: lu.small / sor.small / fft.small</text>

  <rect x="1020" y="246" width="290" height="158" rx="12" ry="12" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.4"/>
  <rect x="1020" y="440" width="290" height="158" rx="12" ry="12" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.4"/>
  <rect x="1020" y="634" width="290" height="158" rx="12" ry="12" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.4"/>

  <text x="1165" y="286" font-family="Menlo, Monaco, monospace" font-size="18" text-anchor="middle" fill="#355b88">Chapter 6.1</text>
  <text x="1165" y="320" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="24" font-weight="700" text-anchor="middle" fill="#333333">JIT 进入时机问题</text>
  <text x="1165" y="350" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="18" text-anchor="middle" fill="#555555">回答 warmup_threshold</text>
  <text x="1165" y="376" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="18" text-anchor="middle" fill="#555555">是否过于保守</text>

  <text x="1165" y="480" font-family="Menlo, Monaco, monospace" font-size="18" text-anchor="middle" fill="#7a5a00">Chapter 6.2</text>
  <text x="1165" y="514" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="24" font-weight="700" text-anchor="middle" fill="#333333">字符串搬移问题</text>
  <text x="1165" y="544" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="18" text-anchor="middle" fill="#555555">回答局部批量搬移</text>
  <text x="1165" y="570" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="18" text-anchor="middle" fill="#555555">何时能形成微收益</text>

  <text x="1165" y="674" font-family="Menlo, Monaco, monospace" font-size="18" text-anchor="middle" fill="#2e6d2e">Chapter 7</text>
  <text x="1165" y="708" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="24" font-weight="700" text-anchor="middle" fill="#333333">LSX SIMD 主结论</text>
  <text x="1165" y="738" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="18" text-anchor="middle" fill="#555555">回答最小可用 lowering</text>
  <text x="1165" y="764" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="18" text-anchor="middle" fill="#555555">为何足以支撑正式结论</text>

  <line x1="376" y1="325" x2="510" y2="325" stroke="#666666" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="890" y1="325" x2="1020" y2="325" stroke="#666666" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="376" y1="519" x2="510" y2="519" stroke="#666666" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="890" y1="519" x2="1020" y2="519" stroke="#666666" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="376" y1="713" x2="510" y2="713" stroke="#666666" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="890" y1="713" x2="1020" y2="713" stroke="#666666" stroke-width="2.2" marker-end="url(#arrow)"/>

  <rect x="840" y="798" width="470" height="76" rx="10" ry="10" fill="#fcefe7" stroke="#d57a2a" stroke-width="1.3"/>
  <text x="1075" y="826" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="17" text-anchor="middle" fill="#a15820">第 6.3 节作为启动期正交案例</text>
  <text x="1075" y="848" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="17" text-anchor="middle" fill="#a15820">说明相同的问题收缩方法</text>
  <text x="1075" y="870" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="17" text-anchor="middle" fill="#a15820">也可迁移到 DEX 校验链</text>
</svg>
